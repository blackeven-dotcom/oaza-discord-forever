name: Update roster from Armory

on:
  schedule:
    - cron: "17 * * * *"   # co godzinę
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - roster.json
      - scripts/fetch_armory.py

permissions:
  contents: write

concurrency:
  group: update-roster
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch characters from Armory
        run: python scripts/fetch_armory.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update roster data from Armory"
            git push
          fi
