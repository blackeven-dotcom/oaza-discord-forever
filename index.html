<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster Community</title>
  <meta name="description" content="Lista postaci społeczności World of Warcraft: Forever, dane z Armory Blizzarda">
  <link rel="preconnect" href="https://render.worldofwarcraft.com">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="community-name">Roster</h1>
      <p id="community-tagline" class="tagline"></p>
      <nav id="community-links" class="links"></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="summary" aria-live="polite">
      <div class="stat"><span class="stat-value" id="stat-count">–</span><span class="stat-label">postaci</span></div>
      <div class="stat"><span class="stat-value" id="stat-level">–</span><span class="stat-label">średni poziom</span></div>
      <div class="stat"><span class="stat-value" id="stat-ilvl">–</span><span class="stat-label">średni ilvl</span></div>
      <div class="stat"><span class="stat-value" id="stat-factions">–</span><span class="stat-label">horda / przymierze</span></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Szukaj postaci, klasy, rasy, profesji…" aria-label="Szukaj">
      <select id="faction-filter" aria-label="Filtr frakcji">
        <option value="">Obie frakcje</option>
        <option value="horde">Horda</option>
        <option value="alliance">Przymierze</option>
      </select>
      <button id="refresh" type="button" title="Wczytaj ponownie dane">Odśwież</button>
      <span id="status" class="status"></span>
    </section>

    <div class="table-wrap">
      <table id="roster">
        <thead>
          <tr>
            <th data-sort="name" aria-sort="none">Postać</th>
            <th data-sort="class">Klasa / rasa</th>
            <th data-sort="level" class="num">Poziom</th>
            <th data-sort="ilvl" class="num">ilvl</th>
            <th data-sort="faction">Frakcja</th>
            <th data-sort="professions">Profesje</th>
            <th data-sort="ruleset">Ruleset</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>

    <p class="footnote">Dane: <a href="https://worldofwarcraft.blizzard.com/en-gb/forever/eu/armory" rel="noopener">Armory Blizzarda</a>, odświeżane automatycznie co godzinę. Armory aktualizuje postać po wylogowaniu z gry. Postać, której Armory nie zna, pokazuje się jako „brak w Armory”.</p>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
