<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster Community</title>
  <meta name="description" content="Lista postaci społeczności World of Warcraft: Forever">
  <link rel="preconnect" href="https://render.worldofwarcraft.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <p class="eyebrow">Roster postaci</p>
      <h1 id="community-name">Roster</h1>
      <p id="community-tagline" class="tagline"></p>
      <figure class="hero-meme"><img src="assets/meme.jpg" alt="Me and the boys ready to bring the guild back together" width="801" height="478" loading="lazy"></figure>
      <nav id="community-links" class="links"></nav>

      <section class="summary" id="summary" aria-live="polite">
        <div class="stat"><span class="stat-value" id="stat-count">–</span><span class="stat-label">postaci</span></div>
        <div class="stat"><span class="stat-value" id="stat-level">–</span><span class="stat-label">średni poziom</span></div>
        <div class="stat"><span class="stat-value" id="stat-ilvl">–</span><span class="stat-label">średni ilvl</span></div>
        <div class="stat stat-roles">
          <div class="roles">
            <div class="role" title="Tank"><img class="role-icon" src="https://render.worldofwarcraft.com/eu/icons/56/ability_warrior_defensivestance.jpg" alt=""><span class="role-count" id="stat-tank">–</span><span class="role-name">tank</span></div>
            <div class="role" title="Healer"><img class="role-icon" src="https://render.worldofwarcraft.com/eu/icons/56/spell_holy_flashheal.jpg" alt=""><span class="role-count" id="stat-healer">–</span><span class="role-name">heal</span></div>
            <div class="role" title="Range DPS"><img class="role-icon" src="https://render.worldofwarcraft.com/eu/icons/56/ability_marksmanship.jpg" alt=""><span class="role-count" id="stat-range">–</span><span class="role-name">range</span></div>
            <div class="role" title="Melee DPS"><img class="role-icon" src="https://render.worldofwarcraft.com/eu/icons/56/ability_dualwield.jpg" alt=""><span class="role-count" id="stat-melee">–</span><span class="role-name">melee</span></div>
          </div>
        </div>
      </section>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <input id="search" type="search" placeholder="Szukaj postaci, klasy, rasy, profesji…" aria-label="Szukaj">
      <select id="role-filter" aria-label="Filtr roli">
        <option value="">Wszystkie role</option>
        <option value="tank">Tank</option>
        <option value="healer">Healer</option>
        <option value="range">Range DPS</option>
        <option value="melee">Melee DPS</option>
      </select>
      <select id="sort" aria-label="Sortowanie">
        <option value="level">Poziom</option>
        <option value="ilvl">Item level</option>
        <option value="name">Nazwa</option>
        <option value="class">Klasa</option>
        <option value="role">Rola</option>
      </select>
      <button id="refresh" type="button" title="Wczytaj ponownie">↻</button>
      <span id="status" class="status"></span>
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>

    <p class="footnote">Dane z Armory Blizzarda, aktualizowane automatycznie co godzinę.</p>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
