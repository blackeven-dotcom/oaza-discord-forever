<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster Community</title>
  <meta name="description" content="Lista postaci społeczności World of Warcraft, dane z Raider.IO">
  <link rel="preconnect" href="https://raider.io">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="community-name">Roster</h1>
      <p id="community-tagline" class="tagline"></p>
      <nav id="community-links" class="links"></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="summary" aria-live="polite">
      <div class="stat"><span class="stat-value" id="stat-count">–</span><span class="stat-label">postaci</span></div>
      <div class="stat"><span class="stat-value" id="stat-ilvl">–</span><span class="stat-label">średni ilvl</span></div>
      <div class="stat"><span class="stat-value" id="stat-score">–</span><span class="stat-label">średni M+ score</span></div>
      <div class="stat"><span class="stat-value" id="stat-roles">–</span><span class="stat-label">tank / heal / dps</span></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Szukaj postaci, klasy, serwera…" aria-label="Szukaj">
      <select id="role-filter" aria-label="Filtr roli">
        <option value="">Wszystkie role</option>
        <option value="TANK">Tank</option>
        <option value="HEALING">Healer</option>
        <option value="DPS">DPS</option>
      </select>
      <button id="refresh" type="button" title="Pomiń cache i pobierz ponownie">Odśwież</button>
      <span id="status" class="status"></span>
    </section>

    <div class="table-wrap">
      <table id="roster">
        <thead>
          <tr>
            <th data-sort="name" aria-sort="none">Postać</th>
            <th data-sort="class">Klasa / spec</th>
            <th data-sort="ilvl" class="num">ilvl</th>
            <th data-sort="score" class="num">M+ score</th>
            <th data-sort="raid">Raid</th>
            <th data-sort="guild">Gildia</th>
            <th data-sort="realm">Serwer</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>

    <p class="footnote">Dane: <a href="https://raider.io" rel="noopener">Raider.IO</a>. Postać pojawia się po tym, jak Raider.IO ją zaindeksuje. Jeśli jest nieaktualna, wejdź na jej profil na Raider.IO i kliknij odświeżenie tam.</p>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
